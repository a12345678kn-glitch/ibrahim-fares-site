<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ضاغط الفيديو</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101113;
      color: #f4f4f4;
      font-family: Arial, sans-serif;
      padding: 18px;
    }
    .page { max-width: 520px; margin: auto; }
    header, .card, .box {
      background: #18191c;
      border: 1px solid #2b2c30;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 19px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    p { color: #aaa; line-height: 1.7; font-size: 13px; }
    .gold { color: #ffd64a; }
    .file-label, button, .download {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
    }
    .file-label, button { background: #ffd64a; color: #171717; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input[type=file] { display: none; }
    .method {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px;
      border: 1px solid #34353a;
      border-radius: 12px;
      margin: 9px 0;
      cursor: pointer;
    }
    .method:has(input:checked) { border-color: #ffd64a; }
    .method input { accent-color: #ffd64a; margin-top: 3px; }
    .method small { display: block; color: #aaa; margin-top: 5px; line-height: 1.5; }
    video { width: 100%; max-height: 230px; border-radius: 12px; background: #000; }
    .hidden { display: none; }
    progress { width: 100%; height: 12px; accent-color: #ffd64a; }
    .download { background: #26272b; color: #ffd64a; margin-top: 10px; }
    .status { font-size: 13px; color: #ffd64a; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>🎬 ضاغط الفيديو</h1>
      <span class="gold">معالجة داخل المتصفح</span>
    </header>

    <section class="card">
      <h2>1. اختر الفيديو</h2>
      <label class="file-label" for="file">اختيار فيديو من الجهاز</label>
      <input id="file" type="file" accept="video/*">
      <p id="fileInfo">اختر ملف فيديو للبدء.</p>
      <video id="preview" controls playsinline class="hidden"></video>
    </section>

    <section class="card">
      <h2>2. اختر طريقة الضغط</h2>

      <label class="method">
        <input type="radio" name="quality" value="high">
        <span>جودة عالية
          <small>دقة قريبة من الأصل وحجم أكبر.</small>
        </span>
      </label>

      <label class="method">
        <input type="radio" name="quality" value="medium" checked>
        <span>متوازن — موصى به
          <small>تقليل جيد للحجم مع جودة مناسبة.</small>
        </span>
      </label>

      <label class="method">
        <input type="radio" name="quality" value="small">
        <span>حجم صغير
          <small>دقة ومعدل إطارات أقل لتقليل الحجم أكثر.</small>
        </span>
      </label>

      <button id="start" disabled>ابدأ الضغط</button>
    </section>

    <section id="result" class="box hidden">
      <p id="status" class="status"></p>
      <progress id="progress" max="100" value="0"></progress>
      <a id="download" class="download hidden">تنزيل الفيديو المضغوط</a>
    </section>

    <p>الملف يُعالَج على جهازك عبر المتصفح ولا يُرسل إلى خادم. يعتمد توفر الضغط على دعم المتصفح لصيغة WebM.</p>
  </main>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const fileInfo = document.getElementById("fileInfo");
    const startButton = document.getElementById("start");
    const result = document.getElementById("result");
    const statusText = document.getElementById("status");
    const progress = document.getElementById("progress");
    const download = document.getElementById("download");

    let selectedFile = null;
    let sourceUrl = null;
    let outputUrl = null;
    let running = false;

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    fileInput.addEventListener("change", () => {
      selectedFile = fileInput.files[0] || null;
      startButton.disabled = !selectedFile;
      result.classList.add("hidden");
      download.classList.add("hidden");

      if (!selectedFile) return;

      if (sourceUrl) URL.revokeObjectURL(sourceUrl);
      sourceUrl = URL.createObjectURL(selectedFile);
      preview.src = sourceUrl;
      preview.classList.remove("hidden");
      fileInfo.textContent = selectedFile.name + " — " + formatSize(selectedFile.size);
    });

    startButton.addEventListener("click", async () => {
      if (!selectedFile || running) return;

      if (!HTMLCanvasElement.prototype.captureStream ||
          !HTMLMediaElement.prototype.captureStream) {
        alert("متصفحك لا يدعم هذه الطريقة. جرّب Chrome أو Edge حديثاً.");
        return;
      }

      const quality = document.querySelector('input[name="quality"]:checked').value;
      const settings = {
        high:   { maxWidth: 1920, fps: 30, bitrate: 2500000 },
        medium: { maxWidth: 1280, fps: 24, bitrate: 1200000 },
        small:  { maxWidth: 854,  fps: 20, bitrate: 650000 }
      }[quality];

      running = true;
      startButton.disabled = true;
      result.classList.remove("hidden");
      download.classList.add("hidden");
      progress.value = 0;
      statusText.textContent = "جارٍ تجهيز الفيديو…";

      let recorder;
      let canvasStream;
      let inputStream;
      let animationId;

      try {
        if (preview.readyState < 1) {
          await new Promise((resolve, reject) => {
            preview.onloadedmetadata = resolve;
            preview.onerror = reject;
          });
        }

        const scale = Math.min(1, settings.maxWidth / preview.videoWidth);
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(2, Math.round(preview.videoWidth * scale / 2) * 2);
        canvas.height = Math.max(2, Math.round(preview.videoHeight * scale / 2) * 2);

        const context = canvas.getContext("2d");
        canvasStream = canvas.captureStream(settings.fps);
        inputStream = preview.captureStream();

        // إضافة صوت الفيديو الأصلي، إذا كان متوفراً.
        for (const track of inputStream.getAudioTracks()) {
          canvasStream.addTrack(track);
        }

        const mimeType = [
          "video/webm;codecs=vp9,opus",
          "video/webm;codecs=vp8,opus",
          "video/webm"
        ].find(type => MediaRecorder.isTypeSupported(type));

        if (!mimeType) {
          throw new Error("المتصفح لا يدعم تسجيل WebM.");
        }

        const chunks = [];
        recorder = new MediaRecorder(canvasStream, {
          mimeType,
          videoBitsPerSecond: settings.bitrate
        });

        recorder.ondataavailable = event => {
          if (event.data && event.data.size) chunks.push(event.data);
        };

        const finished = new Promise((resolve, reject) => {
          recorder.onstop = resolve;
          recorder.onerror = () => reject(new Error("تعذّر تسجيل الفيديو."));
        });

        function drawFrame() {
          if (preview.ended || preview.paused) return;
          context.drawImage(preview, 0, 0, canvas.width, canvas.height);
          const percent = preview.duration
            ? Math.min(99, (preview.currentTime / preview.duration) * 100)
            : 0;
          progress.value = percent;
          statusText.textContent = "جارٍ الضغط… " + Math.floor(percent) + "%";
          animationId = requestAnimationFrame(drawFrame);
        }

        preview.currentTime = 0;
        await preview.play();
        recorder.start(1000);
        drawFrame();

        await new Promise(resolve => {
          preview.onended = resolve;
        });

        cancelAnimationFrame(animationId);
        if (recorder.state !== "inactive") recorder.stop();
        await finished;

        const blob = new Blob(chunks, { type: mimeType });
        if (outputUrl) URL.revokeObjectURL(outputUrl);
        outputUrl = URL.createObjectURL(blob);

        download.href = outputUrl;
        download.download = selectedFile.name.replace(/\.[^.]+$/, "") + "-compressed.webm";
        download.textContent = "تنزيل الناتج — " + formatSize(blob.size);
        download.classList.remove("hidden");

        progress.value = 100;
        statusText.textContent =
          "اكتمل الضغط. حجم الناتج: " + formatSize(blob.size) +
          " (الأصلي: " + formatSize(selectedFile.size) + ")";
      } catch (error) {
        statusText.textContent = "تعذّر الضغط: " + error.message;
      } finally {
        if (animationId) cancelAnimationFrame(animationId);
        if (recorder && recorder.state !== "inactive") recorder.stop();
        if (inputStream) inputStream.getTracks().forEach(track => track.stop());
        if (canvasStream) canvasStream.getTracks().forEach(track => track.stop());
        preview.pause();
        running = false;
        startButton.disabled = !selectedFile;
      }
    });
  </script>
</body>
</html>
