<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معالج الفيديو داخل المتصفح</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0d;--card:#151517;--line:#2b2b30;--y:#f4c430;--t:#f2f2f2;--m:#8f8f98;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;padding:12px 14px 60px;max-width:560px;margin:auto}
header{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--y);color:#111;font-weight:700;display:grid;place-items:center}
header b{font-size:18px}
section{margin-bottom:26px}
.step{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.n{width:48px;height:48px;border-radius:14px;background:var(--y);color:#111;font-weight:700;font-size:20px;display:grid;place-items:center;flex:none}
h2{font-size:24px;line-height:1.3}
.step p,.hint{color:var(--m);font-size:14px}
.drop{display:block;text-align:center;border:2px dashed var(--line);border-radius:20px;padding:34px 16px;cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:var(--y)}
.drop strong{display:block;font-size:18px;margin-bottom:4px}
.drop small{color:var(--m)}
.file{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.file video{width:84px;height:64px;object-fit:cover;border-radius:10px;background:#000;flex:none}
.file b{display:block;word-break:break-all;direction:ltr;text-align:right;font-size:15px}
