<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ضاغط الفيديو | إبراهيم فارس</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    header {
      background: white;
      border-bottom: 1px solid #e5e9f0;
      padding: 17px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { color: #1769e0; font-size: 20px; font-weight: bold; }
    header span { color: #687386; font-size: 14px; }
    main { width: min(720px, 92%); margin: 42px auto; text-align: center; }
    h1 { margin-bottom: 10px; font-size: clamp(28px, 6vw, 40px); }
    .intro { color: #687386; line-height: 1.8; margin-bottom: 25px; }
    .card {
      padding: 24px;
      background: white;
      border: 1px solid #e5eaf1;
      border-radius: 16px;
      box-shadow: 0 10px 30px #1d35570d;
      text-align: right;
    }
    .upload {
      display: block;
      padding: 28px 15px;
      border: 2px dashed #b9c9df;
      border-radius: 13px;
      text-align: center;
      background: #fafcff;
      cursor: pointer;
    }
    input[type="file"] { display: none; }
    .pick, button, .download {
      display: inline-block;
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: #1769e0;
      color: white;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
    label.option { display: block; font-weight: bold; }
    select {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #d8e0eb;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }
    video { display: none; width: 100%; max-height: 330px; margin-top: 18px; background: #111; border-radius: 10px; }
    #fileInfo, #status { color: #657186; line-height: 1.7; }
    .progress-wrap { display: none; margin: 16px 0; }
    progress { width: 100%; height: 16px; accent-color: #1769e0; }
    #percent { text-align: center; color: #1769e0; font-weight: bold; }
    .actions { text-align: center; margin-top: 18px; }
    .download { display: none; margin-top: 12px; }
    .note { font-size: 13px; color: #778296; line-height: 1.7; }
    footer { padding: 22px; text-align: center; color: #8791a1; font-size: 13px; }
    @media (max-width: 520px) {
      .options { grid-template-columns: 1fr; }
      .card { padding: 17px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">إبراهيم فارس</div>
    <span>ضاغط الفيديو</span>
  </header>

  <main>
    <h1>ضغط الفيديو أونلاين</h1>
    <p class="intro">اختر فيديو، حدد الدقة والجودة، ثم اضغطه ونزّله.</p>

    <section class="card">
      <label class="upload" for="videoInput">
        <strong>اختَر فيديو من جهازك</strong>
        <p>اضغط هنا لاختيار ملف فيديو</p>
        <span class="pick">اختيار فيديو</span>
      </label>
      <input id="videoInput" type="file" accept="video/*">

      <p id="fileInfo">لم يتم اختيار فيديو بعد.</p>

      <div class="options">
        <label class="option" for="resolution">
          الدقة
          <select id="resolution">
            <option value="1080">1080p</option>
            <option value="720" selected>720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </label>

        <label class="option" for="quality">
          مستوى الضغط
          <select id="quality">
            <option value="23">جودة عالية</option>
            <option value="28" selected>متوازن</option>
            <option value="33">حجم أصغر</option>
          </select>
        </label>
      </div>

      <video id="preview" controls playsinline></video>

      <div class="progress-wrap" id="progressWrap">
        <progress id="progress" max="100" value="0"></progress>
        <div id="percent">0%</div>
      </div>

      <p id="status" aria-live="polite"></p>

      <div class="actions">
        <button id="compressButton" disabled>ضغط الفيديو</button>
        <br>
        <a id="downloadLink" class="download" download="ibrahim-fares-compressed.mp4">
          تنزيل الفيديو المضغوط
        </a>
      </div>

      <p class="note">
        قد يستغرق الضغط وقتًا، ويعتمد على حجم الفيديو وسرعة الجهاز.
        لا تغلق الصفحة أثناء المعالجة.
      </p>
    </section>
  </main>

  <footer>© <span id="year"></span> إبراهيم فارس</footer>

  <script type="module">
    import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
    import { fetchFile, toBlobURL } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";

    const input = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const fileInfo = document.getElementById("fileInfo");
    const status = document.getElementById("status");
    const button = document.getElementById("compressButton");
    const downloadLink = document.getElementById("downloadLink");
    const progressWrap = document.getElementById("progressWrap");
    const progress = document.getElementById("progress");
    const percent = document.getElementById("percent");

    document.getElementById("year").textContent = new Date().getFullYear();

    let selectedFile = null;
    let previewUrl = null;
    let resultUrl = null;
    let ffmpeg = null;
    let isLoaded = false;

    input.addEventListener("change", () => {
      selectedFile = input.files?.[0];
      if (!selectedFile) return;

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(selectedFile);
      preview.src = previewUrl;
      preview.style.display = "block";
      button.disabled = false;
      downloadLink.style.display = "none";
      fileInfo.textContent = `${selectedFile.name} — ${formatBytes(selectedFile.size)}`;
      status.textContent = "";
    });

    button.addEventListener("click", async () => {
      if (!selectedFile) return;

      button.disabled = true;
      downloadLink.style.display = "none";
      progressWrap.style.display = "block";
      progress.value = 0;
      percent.textContent = "0%";

      try {
        if (!isLoaded) {
          status.textContent = "جارٍ تحميل محرك الضغط لأول مرة...";
          ffmpeg = new FFmpeg();

          ffmpeg.on("progress", ({ progress: value }) => {
            const p = Math.max(0, Math.min(100, Math.round(value * 100)));
            progress.value = p;
            percent.textContent = p + "%";
          });

          const base = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";
          await ffmpeg.load({
            coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, "text/javascript"),
            wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, "application/wasm")
          });

          isLoaded = true;
        }

        status.textContent = "جارٍ ضغط الفيديو...";

        const inputName = "input-video";
        const outputName = "compressed-video.mp4";
        const maxHeight = document.getElementById("resolution").value;
        const crf = document.getElementById("quality").value;

        await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));

        await ffmpeg.exec([
          "-i", inputName,
          "-vf", `scale=-2:${maxHeight}`,
          "-c:v", "libx264",
          "-preset", "veryfast",
          "-crf", crf,
          "-c:a", "aac",
          "-b:a", "128k",
          "-movflags", "+faststart",
          outputName
        ]);

        const data = await ffmpeg.readFile(outputName);
        const blob = new Blob([data], { type: "video/mp4" });

        if (resultUrl) URL.revokeObjectURL(resultUrl);
        resultUrl = URL.createObjectURL(blob);

        downloadLink.href = resultUrl;
        downloadLink.download = "ibrahim-fares-compressed.mp4";
        downloadLink.style.display = "inline-block";

        const saved = Math.max(0, Math.round((1 - blob.size / selectedFile.size) * 100));
        status.textContent =
          `اكتمل الضغط — الحجم الجديد: ${formatBytes(blob.size)} — التوفير: ${saved}%`;
        progress.value = 100;
        percent.textContent = "اكتمل";
      } catch (error) {
        console.error(error);
        status.textContent =
          "تعذر الضغط. جرّب فيديو أصغر أو افتح الموقع بمتصفح Chrome واترك الصفحة مفتوحة.";
      } finally {
        button.disabled = false;
      }
    });

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " بايت";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " كيلوبايت";
      return (bytes / (1024 * 1024)).toFixed(2) + " ميغابايت";
    }
  </script>
</body>
</html>
