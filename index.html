<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ضغط الفيديو | إبراهيم فارس</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    header {
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #e7ebf1;
    }

    .brand { color: #1769e0; font-size: 20px; font-weight: bold; }
    header span { color: #687386; font-size: 14px; }

    main {
      width: min(680px, 92%);
      margin: 40px auto;
      text-align: center;
    }

    h1 { font-size: 34px; margin-bottom: 10px; }

    .intro {
      color: #687386;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .box {
      padding: 24px;
      background: white;
      border: 1px solid #e5eaf1;
      border-radius: 16px;
      box-shadow: 0 12px 35px #1d35570d;
    }

    .picker {
      display: block;
      padding: 28px 16px;
      border: 2px dashed #b7c8df;
      border-radius: 14px;
      background: #f9fbfe;
    }

    input[type="file"] { display: none; }

    button, .download, .choose {
      display: inline-block;
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #1769e0;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .settings { margin-top: 22px; text-align: right; }

    select {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #d8e0eb;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }

    video {
      display: none;
      width: 100%;
      max-height: 320px;
      margin-top: 18px;
      background: #111;
      border-radius: 10px;
    }

    #status { min-height: 28px; color: #687386; line-height: 1.7; }

    .download { display: none; margin-top: 10px; }

    footer { padding: 20px; color: #8791a1; text-align: center; }

    .hint { color: #687386; font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <div class="brand">إبراهيم فارس</div>
    <span>أداة ضغط الفيديو</span>
  </header>

  <main>
    <h1>اضغط فيديوهاتك بسهولة</h1>
    <p class="intro">اختَر فيديو، وحدد الدقة، ثم ابدأ الضغط ونزّل النتيجة.</p>

    <section class="box">
      <label class="picker" for="videoInput">
        <strong>اختَر فيديو من جهازك</strong>
        <p>يفضل استخدام Chrome على Android</p>
        <span class="choose">اختيار فيديو</span>
      </label>

      <input id="videoInput" type="file" accept="video/*">

      <div class="settings">
        <label for="resolution">دقة الفيديو بعد الضغط</label>
        <select id="resolution">
          <option value="1080">1080p — جودة أعلى</option>
          <option value="720" selected>720p — متوسطة</option>
          <option value="480">480p — حجم أقل</option>
          <option value="360">360p — أصغر حجم</option>
        </select>
      </div>

      <video id="preview" controls playsinline></video>
      <p id="status" aria-live="polite">لم يتم اختيار فيديو بعد.</p>

      <button id="compressButton" disabled>ضغط الفيديو</button>
      <br>
      <a id="downloadLink" class="download" download="ibrahim-fares-compressed.webm">
        تنزيل الفيديو المضغوط
      </a>

      <p class="hint">
        اترك الصفحة مفتوحة أثناء الضغط. قد لا يدعم بعض المتصفحات تسجيل الفيديو.
      </p>
    </section>
  </main>

  <footer>© <span id="year"></span> إبراهيم فارس</footer>

  <script>
    const input = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const statusText = document.getElementById("status");
    const button = document.getElementById("compressButton");
    const resolutionSelect = document.getElementById("resolution");
    const downloadLink = document.getElementById("downloadLink");

    let videoUrl = null;
    let outputUrl = null;
    let selectedFile = null;

    document.getElementById("year").textContent = new Date().getFullYear();

    input.addEventListener("change", () => {
      selectedFile = input.files[0];
      downloadLink.style.display = "none";

      if (!selectedFile) return;

      if (videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl = URL.createObjectURL(selectedFile);

      preview.src = videoUrl;
      preview.style.display = "block";
      button.disabled = false;
      statusText.textContent =
        `الفيديو: ${selectedFile.name} — الحجم: ${formatBytes(selectedFile.size)}`;
    });

    button.addEventListener("click", async () => {
      if (!selectedFile) return;

      if (!window.MediaRecorder || !preview.captureStream) {
        statusText.textContent =
          "متصفحك لا يدعم ضغط الفيديو بهذه الطريقة. جرّب Chrome أو Firefox على جهاز آخر.";
        return;
      }

      button.disabled = true;
      downloadLink.style.display = "none";
      statusText.textContent = "جارٍ تجهيز الفيديو...";

      try {
        await waitForVideo();

        const maxHeight = Number(resolutionSelect.value);
        const scale = Math.min(1, maxHeight / preview.videoHeight);
        const width = Math.max(2, Math.round(preview.videoWidth * scale / 2) * 2);
        const height = Math.max(2, Math.round(preview.videoHeight * scale / 2) * 2);

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");

        const canvasStream = canvas.captureStream(24);
        const sourceStream = preview.captureStream
          ? preview.captureStream()
          : preview.mozCaptureStream();

        sourceStream.getAudioTracks().forEach(track => {
          canvasStream.addTrack(track);
        });

        const mimeType = chooseMimeType();
        if (!mimeType) {
          throw new Error("هذا المتصفح لا يدعم صيغة WebM للتسجيل.");
        }

        const recorder = new MediaRecorder(canvasStream, {
          mimeType,
          videoBitsPerSecond: maxHeight >= 720 ? 1800000 : 800000
        });

        const chunks = [];

        recorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        };

        const finished = new Promise((resolve, reject) => {
          recorder.onstop = resolve;
          recorder.onerror = () => reject(new Error("حدث خطأ أثناء ضغط الفيديو."));
        });

        preview.currentTime = 0;
        recorder.start(1000);
        await preview.play();

        statusText.textContent = "جارٍ ضغط الفيديو... اترك الصفحة مفتوحة.";

        function drawFrame() {
          if (recorder.state !== "recording") return;

          context.drawImage(preview, 0, 0, width, height);

          if (!preview.paused && !preview.ended) {
            requestAnimationFrame(drawFrame);
          }
        }

        drawFrame();

        await new Promise(resolve => {
          preview.onended = resolve;
        });

        recorder.stop();
        await finished;

        const blob = new Blob(chunks, { type: mimeType });

        if (outputUrl) URL.revokeObjectURL(outputUrl);
        outputUrl = URL.createObjectURL(blob);

        downloadLink.href = outputUrl;
        downloadLink.download = "ibrahim-fares-compressed.webm";
        downloadLink.style.display = "inline-block";

        statusText.textContent =
          `اكتمل الضغط. الحجم الجديد: ${formatBytes(blob.size)} ` +
          `(الحجم الأصلي: ${formatBytes(selectedFile.size)})`;
      } catch (error) {
        statusText.textContent = error.message || "تعذر ضغط الفيديو.";
      } finally {
        button.disabled = false;
      }
    });

    function chooseMimeType() {
      const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
      return types.find(type => MediaRecorder.isTypeSupported(type)) || "";
    }

    function waitForVideo() {
      return new Promise((resolve, reject) => {
        if (preview.readyState >= 2 && preview.videoWidth) {
          resolve();
          return;
        }

        preview.onloadedmetadata = resolve;
        preview.onerror = () => reject(new Error("تعذر فتح الفيديو."));
      });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + " بايت";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " كيلوبايت";
      return (bytes / (1024 * 1024)).toFixed(2) + " ميغابايت";
    }
  </script>
</body>
</html>
