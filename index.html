<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>ضغط الفيديو</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px 12px 35px;
      color: #f5f5f5;
      background: #101114;
      font-family: Arial, sans-serif;
    }

    main { max-width: 560px; margin: auto; }

    .header, .card {
      background: #191a1f;
      border: 1px solid #303139;
      border-radius: 17px;
      padding: 17px;
      margin-bottom: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    p { color: #aaa; font-size: 13px; line-height: 1.7; }

    .local {
      color: #8cdfad;
      border: 1px solid #405744;
      border-radius: 20px;
      padding: 7px 9px;
      font-size: 11px;
      white-space: nowrap;
    }

    .picker, button, .download {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .picker, button {
      color: #171717;
      background: #f4d24f;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }
    input[type="file"] { display: none; }

    .file-info {
      display: none;
      overflow-wrap: anywhere;
      color: #ccc;
      background: #23242a;
      border-radius: 11px;
      padding: 12px;
      margin-top: 11px;
      font-size: 13px;
    }

    .quality {
      display: block;
      background: #15161a;
      border: 1px solid #34353b;
      border-radius: 12px;
      padding: 13px;
      margin: 9px 0;
      cursor: pointer;
    }

    .quality:has(input:checked) {
      border-color: #f4d24f;
      background: #211f17;
    }

    .quality input { accent-color: #f4d24f; }
    .quality small { display: block; color: #aaa; margin: 6px 24px 0 0; line-height: 1.6; }

    .status-box { display: none; }
    .status { color: #f4d24f; overflow-wrap: anywhere; }
    .error { color: #ff8585; }
    .success { color: #8cdfad; }
    progress { width: 100%; height: 12px; accent-color: #f4d24f; }

    .download {
      display: none;
      margin-top: 12px;
      color: #171717;
      background: #f4d24f;
      text-decoration: none;
    }

    .note { text-align: center; font-size: 12px; color: #999; }
  </style>
</head>

<body>
<main>
  <header class="header">
    <div>
      <h1>ضغط الفيديو</h1>
      <p style="margin:5px 0 0">ضغط داخل المتصفح، بدون رفع الملف</p>
    </div>
    <span class="local">● معالجة محلية</span>
  </header>

  <section class="card">
    <h2>1. اختر الفيديو</h2>
    <label class="picker" for="videoFile">اختيار فيديو من الجهاز</label>
    <input id="videoFile" type="file" accept="video/*">
    <div class="file-info" id="fileInfo"></div>
  </section>

  <section class="card">
    <h2>2. اختر مستوى الضغط</h2>

    <label class="quality">
      <input type="radio" name="level" value="24">
      ضغط خفيف
      <small>يحافظ على جودة أعلى، وقد يكون تقليل الحجم أقل.</small>
    </label>

    <label class="quality">
      <input type="radio" name="level" value="28" checked>
      ضغط متوازن — موصى به
      <small>توازن بين جودة الفيديو وحجم الملف.</small>
    </label>

    <label class="quality">
      <input type="radio" name="level" value="32">
      ضغط أقوى
      <small>حجم أقل غالباً، مع احتمال انخفاض أوضح في الجودة.</small>
    </label>

    <button id="startButton" type="button" disabled>ابدأ الضغط</button>
  </section>

  <section class="card status-box" id="statusBox">
    <p class="status" id="statusText">جارٍ التحضير…</p>
    <progress id="progress" max="100" value="0"></progress>
    <a class="download" id="downloadLink">تنزيل الفيديو المضغوط</a>
  </section>

  <p class="note">
    الضغط لا يغيّر مدة الفيديو أو دقته. قد لا يصغر الملف إذا كان مضغوطاً مسبقاً.
    لا تغلق الصفحة أثناء المعالجة.
  </p>
</main>

<script type="module">
  const fileInput = document.getElementById("videoFile");
  const fileInfo = document.getElementById("fileInfo");
  const startButton = document.getElementById("startButton");
  const statusBox = document.getElementById("statusBox");
  const statusText = document.getElementById("statusText");
  const progress = document.getElementById("progress");
  const downloadLink = document.getElementById("downloadLink");

  let selectedFile = null;
  let ffmpeg = null;
  let loadPromise = null;
  let outputUrl = null;
  let isBusy = false;

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function setStatus(message, className = "") {
    statusText.textContent = message;
    statusText.className = "status " + className;
  }

  fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files && fileInput.files[0];

    if (!selectedFile) {
      startButton.disabled = true;
      fileInfo.style.display = "none";
      return;
    }

    if (!selectedFile.type.startsWith("video/")) {
      alert("اختر ملف فيديو صحيحاً.");
      fileInput.value = "";
      selectedFile = null;
      return;
    }

    fileInfo.textContent = selectedFile.name + " — " + formatSize(selectedFile.size);
    fileInfo.style.display = "block";
    startButton.disabled = false;
    statusBox.style.display = "none";
    downloadLink.style.display = "none";

    if (outputUrl) {
      URL.revokeObjectURL(outputUrl);
      outputUrl = null;
    }
  });

  async function loadEngine() {
    if (ffmpeg) return ffmpeg;
    if (loadPromise) return loadPromise;

    loadPromise = (async () => {
      setStatus("جارٍ تحميل محرك الضغط لأول مرة…");

      const [{ FFmpeg }, { toBlobURL }] = await Promise.all([
        import("https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js"),
        import("https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js")
      ]);

      const engine = new FFmpeg();

      engine.on("progress", event => {
        if (typeof event.progress === "number" && Number.isFinite(event.progress)) {
          const percent = Math.max(0, Math.min(99, Math.round(event.progress * 100)));
          progress.value = percent;
          setStatus("جارٍ ضغط الفيديو… " + percent + "%");
        }
      });

      const base = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";

      const coreURL = await toBlobURL(base + "/ffmpeg-core.js", "text/javascript");
      const wasmURL = await toBlobURL(base + "/ffmpeg-core.wasm", "application/wasm");

      await engine.load({ coreURL, wasmURL });
      ffmpeg = engine;
      return engine;
    })();

    try {
      return await loadPromise;
    } catch (error) {
      loadPromise = null;
      throw error;
    }
  }

  function makeOutputName(name) {
    const base = name.replace(/\.[^/.]+$/, "").replace(/[^\w\-ء-ي]+/g, "_");
    return (base || "video") + "_compressed.mp4";
  }

  startButton.addEventListener("click", async () => {
    if (!selectedFile || isBusy) return;

    isBusy = true;
    startButton.disabled = true;
    statusBox.style.display = "block";
    downloadLink.style.display = "none";
    progress.value = 0;
    setStatus("جارٍ بدء الضغط…");

    const inputName = "input_video";
    const outputName = "compressed_video.mp4";
    let engine;

    try {
      engine = await loadEngine();

      setStatus("جارٍ تجهيز الفيديو…");
      const inputBytes = new Uint8Array(await selectedFile.arrayBuffer());
      await engine.writeFile(inputName, inputBytes);

      const crf = document.querySelector('input[name="level"]:checked').value;

      const args = [
        "-i", inputName,
        "-map", "0:v:0",
        "-map", "0:a?",
        "-c:v", "libx264",
        "-preset", "ultrafast",
        "-crf", crf,
        "-c:a", "aac",
        "-b:a", "128k",
        "-movflags", "+faststart",
        "-y", outputName
      ];

      setStatus("جارٍ ضغط الفيديو… اترك الصفحة مفتوحة.");
      const exitCode = await engine.exec(args);

      if (exitCode !== 0) {
        throw new Error("محرك الضغط أوقف العملية. رمز الخطأ: " + exitCode);
      }

      const outputData = await engine.readFile(outputName);
      const outputBlob = new Blob([outputData], { type: "video/mp4" });

      if (!outputBlob.size) {
        throw new Error("لم يتم إنشاء ملف ناتج.");
      }

      if (outputUrl) URL.revokeObjectURL(outputUrl);
      outputUrl = URL.createObjectURL(outputBlob);

      downloadLink.href = outputUrl;
      downloadLink.download = makeOutputName(selectedFile.name);
      downloadLink.textContent = "تنزيل الملف المضغوط — " + formatSize(outputBlob.size);
      downloadLink.style.display = "block";

      progress.value = 100;
      setStatus(
        "اكتمل الضغط. الأصلي: " + formatSize(selectedFile.size) +
        " — الناتج: " + formatSize(outputBlob.size),
        "success"
      );

      try { await engine.deleteFile(inputName); } catch {}
      try { await engine.deleteFile(outputName); } catch {}

    } catch (error) {
      console.error("Compression error:", error);
      const detail = error && error.message ? error.message : String(error);
      setStatus("تعذّر الضغط: " + detail, "error");
    } finally {
      isBusy = false;
      startButton.disabled = !selectedFile;
    }
  });
</script>
</body>
</html>
